name: Build Keyboard 72 APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK, NDK and CMake
        run: |
          echo "Installing NDK 27.2.12479018 and CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew build-apk.sh

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List built APKs
        run: |
          echo "Found APKs:"
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard72-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
